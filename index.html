<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e2528">
<title>Remixa · Chapter One</title>
<style>
:root {
  color-scheme:dark;
  --tile:58px; --gap:4px; --border:4px; --corner:9px; --snap-ms:180ms;
  --ink:#f1f5eb; --muted:#a6bfbd; --cream:#ffdc8e;
  --bg:#0e2528; --panel:#18363a; --board:#204244;
  --green:#55e3ad; --red:#fa7176; --amber:#efb75b;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
* {box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body {width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none;}
button,input {font:inherit;}
button {border:0;cursor:pointer;color:inherit;touch-action:manipulation;}
#app {position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(ellipse 100% 130% at 50% 2%,#23484b 0,#102a2e 65%,#0c2225 100%);overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#header {height:53px;min-height:53px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;gap:12px;}
.brand {font-size:26px;line-height:1;font-weight:860;letter-spacing:-1.7px;color:#ffdb91;}
.header-center {display:flex;gap:9px;align-items:center;font-size:12px;letter-spacing:.06em;color:#bed1cb;font-weight:650;}
.header-controls {display:flex;align-items:center;gap:8px;}
.icon-btn {height:35px;min-width:37px;border:1px solid #4a6966;border-radius:11px;background:#24474a;color:#e7eee8;display:grid;place-items:center;font-size:19px;line-height:1;transition:background .12s;}
.icon-btn:active {background:#3b696b;}
#play {display:flex;width:100%;min-width:0;min-height:0;flex:1;padding:0 9px 9px;}
#board {position:relative;flex:1;width:100%;min-height:0;min-width:0;overflow:hidden;border-radius:17px;height:100%;background:linear-gradient(145deg,#254b4b,#1d3f42 90%);border:1px solid #456766;isolation:isolate;}

#board::before {content:"";pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 59px,#ffffff04 60px 61px);opacity:.45;}
#groupLayer,#tileLayer {position:absolute;inset:0;pointer-events:none;}
#groupLayer {z-index:1;} #tileLayer {z-index:2;}
.header-small-btn {height:35px;min-width:54px;padding:0 9px;background:#24474a;border-radius:11px;border:1px solid #4a6966;color:#e7eee8;font-size:11px;font-weight:750;letter-spacing:.045em;}
.header-small-btn:active {background:#3b696b;} .header-small-btn:disabled {opacity:.33;}
.small-btn {height:36px;min-width:0;flex:1;background:#294b50;border-radius:10px;border:1px solid #49696b;color:#e9f0e9;font-size:12px;font-weight:750;letter-spacing:.05em;}
.small-btn:active {background:#3b6765;} .small-btn:disabled {opacity:.35;}
.group {position:absolute;top:0;left:0;box-sizing:border-box;transform-origin:center center;pointer-events:none;border:var(--border) solid var(--green);background:#145244;border-radius:calc(var(--corner) + var(--border));will-change:transform;transition:transform var(--snap-ms) cubic-bezier(.19,.95,.33,1),width var(--snap-ms) cubic-bezier(.19,.95,.33,1),height var(--snap-ms) cubic-bezier(.19,.95,.33,1),border-color .18s,background-color .18s;}
.group.valid {border-color:var(--green);background:var(--green);}
.group.incomplete {border-color:var(--red);background:var(--red);}
.group.invalid {border-color:var(--red);background:var(--red);}
.group .slot {position:absolute;width:var(--tile);height:var(--tile);left:0;top:0;border-radius:var(--corner);background:#d0ffe92e;outline:1px solid #ffffff3a;opacity:0;pointer-events:none;transition:opacity .12s,transform var(--snap-ms);}
.group.has-slot .slot {opacity:1;}
.tile {position:absolute;top:0;left:0;width:var(--tile);height:var(--tile);background:var(--tile-color);border-radius:var(--corner);display:flex;align-items:center;justify-content:center;line-height:1;font-size:calc(var(--tile) * .55);font-weight:800;letter-spacing:-.055em;color:white;text-shadow:0 1px 1px #00000025;transform:translate3d(0,0,0);transition:transform var(--snap-ms) cubic-bezier(.15,1.2,.35,1);backface-visibility:hidden;will-change:transform;pointer-events:auto;touch-action:none;cursor:grab;}
.tile.yellow {color:#243c40;text-shadow:none;}

#lessonCue {position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:650;letter-spacing:.055em;color:#d0e8dc;pointer-events:none;white-space:nowrap;z-index:5;opacity:0;transition:opacity .35s;}
#lessonCue.show {opacity:.92;}
/* Small, non-verbal nudge on level 1, only before the player's first touch. */
.tile.hint-pulse {animation:remixaNudge 1.7s ease-in-out infinite;}
@keyframes remixaNudge {
  0%,100% {filter:brightness(1);}
  45% {filter:brightness(1.16);box-shadow:0 0 0 6px #f6d49a33;}
}

.tile.dragging {animation:none!important;transition:none;z-index:50;cursor:grabbing;box-shadow:0 15px 26px #0009,0 5px 9px #0006;filter:brightness(1.045);}
#dragLayer {position:fixed;inset:0;pointer-events:none;z-index:90;overflow:visible;}
#dragLayer .tile {pointer-events:none;}
#win {position:fixed;inset:0;background:#071e20ca;backdrop-filter:blur(5px);z-index:110;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
#win.show {opacity:1;pointer-events:auto;}
.win-card {background:#214745;border:1px solid #6a8c72;border-radius:22px;padding:32px 36px;text-align:center;box-shadow:0 24px 80px #071414aa;min-width:min(370px,90vw);transform:translateY(25px) scale(.97);transition:transform .42s cubic-bezier(.2,1.3,.35,1);}
#win.show .win-card {transform:translateY(0) scale(1);}
.win-icon {font-size:42px;color:#f7d28c;margin-bottom:5px;}
.win-heading {font-weight:850;font-size:27px;color:white;letter-spacing:-.04em;}
.win-sub {font-size:14px;color:#bdd6c8;margin:9px 0 22px;}
.primary-btn {background:#f2ce84;color:#193438;border-radius:12px;padding:12px 25px;font-weight:800;}
#lab {position:fixed;z-index:130;right:12px;top:58px;background:#102f32f5;border:1px solid #61817b;border-radius:18px;width:min(320px,calc(100vw - 24px));padding:17px 18px 18px;box-shadow:0 20px 45px #0009;display:none;}
#lab.show {display:block;}
.lab-head {display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.lab-head strong {font-size:17px;}
.lab-head button {background:none;font-size:22px;color:#dce8e3;}
.lab-help {color:#a9c5bc;font-size:11px;line-height:1.5;margin-bottom:10px;}
.lab-row {display:grid;grid-template-columns:1fr auto;gap:0 12px;margin:12px 0 6px;align-items:center;}
.lab-row label {font-size:12px;font-weight:700;}
.lab-row output {color:#f8dc98;font-size:12px;font-variant-numeric:tabular-nums;}
.lab-row input {grid-column:1 / -1;width:100%;accent-color:#60d8af;margin:10px 0 0;height:18px;}
.lab-foot {display:flex;gap:8px;margin-top:14px;}
.lab-foot button {border-radius:9px;padding:9px 10px;background:#2f5759;font-size:12px;font-weight:700;flex:1;}
#rotate {position:fixed;inset:0;background:#102a2d;z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;}
#rotate .rot-icon {font-size:51px;color:#f6d591;}
#rotate strong {font-size:22px;}
#rotate p {color:#abc9c1;max-width:300px;line-height:1.5;margin:0;}
@media(orientation:portrait) {#rotate {display:flex;}}
@media(max-height:440px) {
  #header {height:43px;min-height:43px;}
  .brand {font-size:24px;}
  .header-small-btn {height:30px;}
  #lab {top:47px;max-height:calc(100dvh - 53px);overflow:auto;}
}

@media(max-width:760px) and (orientation:landscape) {
  #header {padding:0 9px;gap:6px;}
  .brand {font-size:21px;}
  .header-center {gap:5px;font-size:11px;}
  .header-controls {gap:5px;}
  .icon-btn {height:31px;min-width:31px;border-radius:9px;}
  .header-small-btn {height:31px;min-width:46px;padding:0 5px;font-size:10px;border-radius:9px;}
}
@media(max-width:600px) and (orientation:landscape) {
  #levelName {display:none;}
}
@media(prefers-reduced-motion:reduce) {
 .tile,.group,#win,.win-card {transition-duration:.01ms!important;}
}
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="brand">remixa</div>
    <div class="header-center"><span id="levelLabel">01 / 03</span><span id="levelName">First Fit</span></div>
    <div class="header-controls">
      <button class="icon-btn" id="prev" aria-label="Previous puzzle">‹</button>
      <button class="icon-btn" id="next" aria-label="Next puzzle">›</button>
      <button class="header-small-btn" id="undo" aria-label="Undo last move">UNDO</button>
      <button class="header-small-btn" id="reset" aria-label="Restart current puzzle">RESET</button>
      <button class="icon-btn" id="settings" aria-label="Tuning panel">⚙</button>
    </div>
  </header>
  <main id="play">
    <section id="board" aria-label="Puzzle board">
      <div id="groupLayer"></div>
      <div id="tileLayer"></div>
      <div id="lessonCue" aria-live="polite">Make everything green.</div>
    </section>
  </main>
</div>
<div id="dragLayer"></div>
<div id="win">
  <div class="win-card">
    <div class="win-icon">✦</div>
    <div class="win-heading" id="winHeading">Beautifully done.</div>
    <div class="win-sub" id="winSub">Every tile has found its place.</div>
    <button class="primary-btn" id="nextWin">NEXT LEVEL →</button>
  </div>
</div>
<div id="lab" role="dialog" aria-label="Remixa tuning controls">
  <div class="lab-head"><strong>Remixa Lab</strong><button id="closeLab" aria-label="Close settings">×</button></div>
  <div class="lab-help">Tune the feel live on your phone. Settings save automatically on this device.</div>
  <div class="lab-row"><label for="tileRange">Tile size</label><output id="tileOut">58px</output><input id="tileRange" type="range" min="42" max="86" step="1" value="58"></div>
  <div class="lab-row"><label for="cornerRange">Corner radius</label><output id="cornerOut">9px</output><input id="cornerRange" type="range" min="2" max="22" step="1" value="9"></div>
  <div class="lab-row"><label for="gapRange">Gap & border</label><output id="gapOut">4px</output><input id="gapRange" type="range" min="1" max="10" step="1" value="4"></div>
  <div class="lab-row"><label for="springRange">Snap spring</label><output id="springOut">180ms</output><input id="springRange" type="range" min="80" max="450" step="10" value="180"></div>
  <div class="lab-row"><label for="magnetRange">Magnetic reach</label><output id="magnetOut">55%</output><input id="magnetRange" type="range" min="0" max="110" step="5" value="55"></div>
  <div class="lab-foot"><button id="resetLab">Restore defaults</button><button id="closeLab2">Done</button></div>
</div>
<div id="rotate">
  <div class="rot-icon">↻</div><strong>Rotate your phone</strong><p>Remixa feels best in landscape, where there's room to play.</p>
</div>
<script>
'use strict';
// Remixa DOM prototype: pure browser layout and Pointer Events, no external assets.
const $ = id => document.getElementById(id);
const COLORS=['#488be1','#e45e71','#f1bf55','#43bb99','#a581e5'];
const LEVELS=[
  // Chapter 1: introduce one rule or insight at a time.
  {name:'One More',skill:'Extend a run',
   groups:[{axis:'h',u:.46,v:.43,tiles:[[3,0],[4,0],[5,0]]}],
   loose:[{n:6,c:0,u:.66,v:.75}]},
  {name:'Same Same',skill:'Complete a number group',
   groups:[{axis:'v',u:.46,v:.45,tiles:[[7,0],[7,1],[7,2]]}],
   loose:[{n:7,c:4,u:.70,v:.70}]},
  {name:'The Other End',skill:'A run grows both ways',
   groups:[{axis:'h',u:.52,v:.44,tiles:[[4,0],[5,0],[6,0]]}],
   loose:[{n:3,c:0,u:.26,v:.72}]},
  {name:'Two Choices',skill:'Find the matching group',
   groups:[
     {axis:'h',u:.26,v:.40,tiles:[[2,0],[3,0],[4,0]]},
     {axis:'h',u:.71,v:.40,tiles:[[8,4],[9,4],[10,4]]}
   ],
   loose:[{n:11,c:4,u:.74,v:.75}]},
  {name:'Borrow One',skill:'Borrow a tile and keep both groups valid',
   groups:[
     {axis:'h',u:.28,v:.32,tiles:[[2,0],[3,0],[4,0],[5,0]]},
     {axis:'h',u:.75,v:.32,tiles:[[8,3],[9,3],[10,3]]}
   ],
   loose:[
     {n:5,c:1,u:.44,v:.76},
     {n:5,c:2,u:.58,v:.76}
   ]}
];
const defaults={tile:58,corner:9,gap:4,spring:180,magnet:55};
let settings={...defaults};
try {const saved=JSON.parse(localStorage.getItem('remixaLab')||'null'); if(saved) settings={...settings,...saved};}catch(_){}
const board=$('board'), groupsLayer=$('groupLayer'), tilesLayer=$('tileLayer'), dragLayer=$('dragLayer');
let tiles=[],groups=[],active=null,hover=null,history=[],level=0,won=false,nextID=1,nextGroup=1;
let actualTile=58,boardW=1,boardH=1;
// A purely visual collision preview; puzzle positions remain untouched until drop.
let projected=null,previewFrame=0,previewPoint=null;

const clamp=(v,a,b)=>Math.min(Math.max(v,a),Math.max(a,b));
const colorAt=c=>COLORS[c%COLORS.length];
const posStyle=(el,x,y,scale=1)=>{
  el.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0)${scale!==1?` scale(${scale})`:''}`;
};
function tileNew(num,col) {
  const t={id:nextID++,num,col,el:document.createElement('div')};
  t.el.className='tile'+(col===2?' yellow':'');
  t.el.textContent=num;
  t.el.style.setProperty('--tile-color',colorAt(col));
  t.el.dataset.id=t.id;
  t.el.addEventListener('pointerdown',ev=>pointerDown(ev,t));
  tiles.push(t);
  return t;
}
function groupNew(contents,axis,u,v,id=nextGroup++) {
  const g={id,tiles:contents,axis,u,v,el:document.createElement('div')};
  g.el.className='group';
  // A brand-new outline must be painted at its target, never fly in from (0,0).
  g.el.style.transition='none';
  g.fresh=true;
  const slot=document.createElement('div');
  slot.className='slot';g.el.appendChild(slot);g.slot=slot;
  groupsLayer.appendChild(g.el);
  return g;
}
function isValid(g) {
  const a=g.tiles,n=a.length;
  if(n<3)return false;
  if(g.axis==='h') {
    if(n>14||a.some(t=>t.col!==a[0].col))return false;
    return a.every((t,i)=>!i||t.num===a[i-1].num+1);
  }
  return n<=COLORS.length&&a.every(t=>t.num===a[0].num)&&new Set(a.map(t=>t.col)).size===n;
}
function isCompatible(g) {
  const a=g.tiles,n=a.length;
  if(!n)return false;
  if(n>=3)return isValid(g);
  if(n===1)return true;
  return (g.axis==='h'&&a[0].col===a[1].col&&Math.abs(a[0].num-a[1].num)===1)||
         (g.axis==='v'&&a[0].num===a[1].num&&a[0].col!==a[1].col);
}
function snapshot() {
  return {groups:groups.map(g=>({id:g.id,axis:g.axis,u:g.u,v:g.v,ids:g.tiles.map(t=>t.id)}))};
}
function restore(s) {
  clearLivePreview();
  active=null;hover=null;won=false;$('win').classList.remove('show');
  for(const g of groups)g.el.remove();
  const map=new Map(tiles.map(t=>[t.id,t]));
  groups=s.groups.map(g=>groupNew(g.ids.map(id=>map.get(id)),g.axis,g.u,g.v,g.id));
  nextGroup=Math.max(nextGroup, ...groups.map(g=>g.id+1),1);
  layout();
}

let nudgeTimeout=null;
function stopNudge(){
  if(nudgeTimeout!==null)clearTimeout(nudgeTimeout);
  nudgeTimeout=null;
  tiles.forEach(t=>t.el.classList.remove('hint-pulse'));
}
function startNudge(){
  nudgeTimeout=setTimeout(()=>{
    nudgeTimeout=null;
    if(level!==0||history.length||active||won)return;
    const six=tiles.find(t=>t.num===6);
    if(six)six.el.classList.add('hint-pulse');
  },5000);
}
function dismissOpeningHint(){
  stopNudge();
  $('lessonCue').classList.remove('show');
}
function loadLevel(i) {
  if(active)cancelDrag();
  clearLivePreview();
  level=(i+LEVELS.length)%LEVELS.length;
  for(const t of tiles)t.el.remove();
  for(const g of groups)g.el.remove();
  tiles=[];groups=[];hover=null;active=null;history=[];won=false;nextID=1;nextGroup=1;
  const source=LEVELS[level];
  groups=source.groups.map(g=>groupNew(g.tiles.map(v=>tileNew(...v)),g.axis,g.u,g.v));
  // Loose tiles use exactly the same group model, hit testing and rules.
  source.loose.forEach(p=>{
    groups.push(groupNew([tileNew(p.n,p.c)],'h',p.u,p.v));
  });
  $('levelLabel').textContent=`${String(level+1).padStart(2,'0')} / ${String(LEVELS.length).padStart(2,'0')}`;
  $('levelName').textContent=source.name;
  $('win').classList.remove('show');
  $('lessonCue').classList.toggle('show',level===0);
  stopNudge();
  if(level===0)startNudge();
  reflowGroups();
  layout(true);
}
function maxSequence(){return Math.max(...groups.filter(g=>g.axis==='h').map(g=>g.tiles.length),3);}
function measure() {
  boardW=board.clientWidth;boardH=board.clientHeight;
  const longest=Math.max(3, maxSequence());
  const maxByW=(boardW-32-2*settings.gap-(longest-1)*settings.gap)/longest;
  const maxByH=(boardH-34-2*settings.gap-3*settings.gap)/4;
  actualTile=Math.max(21,Math.floor(Math.min(settings.tile,maxByW,maxByH)));
  document.documentElement.style.setProperty('--tile',`${actualTile}px`);
  document.documentElement.style.setProperty('--gap',`${settings.gap}px`);
  document.documentElement.style.setProperty('--border',`${settings.gap}px`);
  document.documentElement.style.setProperty('--corner',`${Math.min(settings.corner,actualTile*.34)}px`);
  document.documentElement.style.setProperty('--snap-ms',`${settings.spring}ms`);
}
function geometry(g,extra=false,axisOverride=null) {
  const axis=axisOverride||g.axis;
  const n=g.tiles.length+(extra?1:0), gap=settings.gap,step=actualTile+gap;
  const w=(axis==='h'?n:1)*actualTile+(axis==='h'?Math.max(0,n-1)*gap:0)+gap*2;
  const h=(axis==='v'?n:1)*actualTile+(axis==='v'?Math.max(0,n-1)*gap:0)+gap*2;
  const x=clamp(g.u*boardW,w/2+3,boardW-w/2-3);
  const y=clamp(g.v*boardH,h/2+3,boardH-h/2-3);
  return {n,step,w,h,x,y,left:x-w/2,top:y-h/2};
}

// Solve rectangular linked-group collisions without DOM reads or mutations.
// The preferred group (or finger-sized ghost) gets first choice of position.
function solveSpaces(items,preferredId=null) {
  const clearance=Math.max(7,settings.gap*1.6);
  const leader=items.find(p=>p.id===preferredId);
  const order=leader?[leader,...items.filter(p=>p!==leader)]:items;
  const placed=[];
  const result=[];
  for(const item of order) {
    const {w,h}=item,halfW=w/2,halfH=h/2;
    const minX=halfW+3,maxX=boardW-halfW-3;
    const minY=halfH+3,maxY=boardH-halfH-3;
    if(minX>maxX||minY>maxY)return null;
    const x0=clamp(item.x,minX,maxX),y0=clamp(item.y,minY,maxY);
    const xs=[x0],ys=[y0];
    for(const p of placed) {
      const dx=halfW+p.w/2+clearance;
      const dy=halfH+p.h/2+clearance;
      xs.push(p.x-dx,p.x+dx);
      ys.push(p.y-dy,p.y+dy);
    }
    let choice=null,score=Infinity;
    const consider=(x,y)=>{
      if(x<minX-.01||x>maxX+.01||y<minY-.01||y>maxY+.01)return;
      if(placed.some(p=>Math.abs(x-p.x)<(w+p.w)/2+clearance-.01 &&
                        Math.abs(y-p.y)<(h+p.h)/2+clearance-.01))return;
      const distance=(x-x0)**2+(y-y0)**2;
      if(distance<score){score=distance;choice={x,y};}
    };
    for(const x of xs)for(const y of ys)consider(x,y);
    if(!choice) {
      const stride=Math.max(8,Math.floor(actualTile/4));
      for(let y=minY;y<=maxY+stride;y+=stride)
        for(let x=minX;x<=maxX+stride;x+=stride)
          consider(Math.min(x,maxX),Math.min(y,maxY));
    }
    if(!choice)return null;
    const positioned={...item,x:choice.x,y:choice.y};
    placed.push(positioned);
    result.push(positioned);
  }
  return result;
}
function spaceItems(extraFor=null,extraAxis=null) {
  return groups.filter(g=>g.tiles.length).map(g=>{
    const axis=g.id===extraFor&&extraAxis?extraAxis:g.axis;
    const n=g.tiles.length+(g.id===extraFor?1:0),step=actualTile+settings.gap;
    const w=(axis==='h'?(n-1)*step+actualTile:actualTile)+settings.gap*2;
    const h=(axis==='v'?(n-1)*step+actualTile:actualTile)+settings.gap*2;
    return {id:g.id,g,w,h,x:g.u*boardW,y:g.v*boardH};
  });
}
// Permanent reflow happens only on drop or setup.
function reflowGroups(preferredId=null) {
  measure();
  const result=solveSpaces(spaceItems(),preferredId);
  if(!result)return false;
  for(const item of result) {
    item.g.u=item.x/Math.max(boardW,1);
    item.g.v=item.y/Math.max(boardH,1);
  }
  return true;
}
// During dragging, reserve space either for the hovered insertion or for
// the free tile beneath the finger. Neighbours spring aside provisionally.
function calculateLivePreview(clientX,clientY) {
  if(!active)return null;
  const br=board.getBoundingClientRect();
  const x=clientX-br.left,y=clientY-br.top;
  if(x<0||x>boardW||y<0||y>boardH)return null;
  const hoveredId=hover?.id??null;
  const items=spaceItems(hoveredId,hover?.axis);
  if(hoveredId!==null) {
    const result=solveSpaces(items,hoveredId);
    return result?new Map(result.map(({id,x,y})=>[id,{x,y}])):null;
  }
  // Treat the dragged tile like a temporary, collision-producing group.
  const fingerItem={id:'finger',g:null,
    w:actualTile+settings.gap*2,h:actualTile+settings.gap*2,
    x,y};
  const result=solveSpaces([fingerItem,...items],'finger');
  return result?new Map(result.filter(p=>p.g).map(({id,x,y})=>[id,{x,y}])):null;
}
function clearLivePreview() {
  if(previewFrame)cancelAnimationFrame(previewFrame);
  previewFrame=0;previewPoint=null;projected=null;
}
function scheduleLivePreview(x,y) {
  previewPoint={x,y};
  if(previewFrame)return;
  previewFrame=requestAnimationFrame(()=>{
    previewFrame=0;
    if(!active||!previewPoint)return;
    const p=previewPoint;
    projected=calculateLivePreview(p.x,p.y);
    layout(false,true);
  });
}
function layout(initial=false,skipMeasure=false) {
  // During drag previews geometry is unchanged: avoid re-measuring and
  // rewriting CSS variables on every pointer animation frame.
  if(!skipMeasure)measure();
  // Border panels sit behind tiles and leave an equal-width coloured channel.
  const used=new Set();
  for(let i=0;i<groups.length;i++) {
    const g=groups[i];
    if(!g.tiles.length){g.el.remove();continue;}
    if(!g.el.isConnected)groupsLayer.appendChild(g.el);
    const pv=hover?.id===g.id?hover:null;
    const geom=geometry(g,!!pv,pv?.axis);
    // Render projected positions only, never alter the actual puzzle state.
    const live=projected?.get(g.id);
    if(live) {
      geom.x=live.x;geom.y=live.y;
      geom.left=live.x-geom.w/2;geom.top=live.y-geom.h/2;
    }
    g.el.classList.remove('valid','invalid','incomplete','has-slot');
    // The colour of an existing group stays fixed throughout a drag.
    // Validation only changes on release, not when a tile is picked up.
    const frozen=active?.colors?.get(g.id);
    g.el.classList.add((frozen===undefined?isValid(g):frozen)?'valid':'invalid');
    if(pv)g.el.classList.add('has-slot');
    g.el.style.width=`${geom.w}px`;g.el.style.height=`${geom.h}px`;
    posStyle(g.el,geom.left,geom.top);
    if(g.fresh){
      g.fresh=false;
      // Flush only once for a newly-created group, while transitions are off.
      // Subsequent repositioning continues to use the normal smooth transition.
      g.el.getBoundingClientRect();
      g.el.style.transition='';
    }
    const renderAxis=pv?.axis||g.axis;
    g.tiles.forEach((t,j)=>{
      used.add(t.id);
      if(t===active?.tile)return;
      if(t.el.parentNode!==tilesLayer)tilesLayer.appendChild(t.el);
      const slot=j+((pv&&j>=pv.index)?1:0);
      const x=geom.x+(renderAxis==='h'?(slot-(geom.n-1)/2)*geom.step:0)-actualTile/2;
      const y=geom.y+(renderAxis==='v'?(slot-(geom.n-1)/2)*geom.step:0)-actualTile/2;
      posStyle(t.el,x,y);
    });
    if(pv) {
      const ix=geom.x+(renderAxis==='h'?(pv.index-(geom.n-1)/2)*geom.step:0)-actualTile/2;
      const iy=geom.y+(renderAxis==='v'?(pv.index-(geom.n-1)/2)*geom.step:0)-actualTile/2;
      posStyle(g.slot,ix-geom.left-settings.gap,iy-geom.top-settings.gap);
    }
  }
  $('undo').disabled=!history.length;
  if(initial) {
    for(const t of tiles)t.el.style.transition='none';
    for(const g of groups)g.el.style.transition='none';
    requestAnimationFrame(()=>{
      for(const t of tiles)t.el.style.transition='';
      for(const g of groups)g.el.style.transition='';
    });
  }
}
function getHover(clientX,clientY) {
  const br=board.getBoundingClientRect();
  const x=clientX-br.left,y=clientY-br.top;
  if(x<0||x>boardW||y<0||y>boardH)return null;
  let best=null,bestDist=1e9;
  for(const g of groups) {
    if(!g.tiles.length)continue;
    const box=geometry(g,false);
    // A one-tile group can grow in either direction. Choose its axis from
    // the tiles' relationship, otherwise from the approach direction.
    if(g.tiles.length===1){
      const dx=x-box.x,dy=y-box.y;
      const reach=actualTile*settings.magnet/100;
      const near=Math.hypot(dx,dy);
      if(near>actualTile*1.27+reach*.55)continue;
      const other=g.tiles[0], moving=active?.tile;
      const sameRank=moving&&moving.num===other.num&&moving.col!==other.col;
      const sequence=moving&&moving.col===other.col&&Math.abs(moving.num-other.num)===1;
      const axis=sameRank?'v':sequence?'h':Math.abs(dx)>=Math.abs(dy)?'h':'v';
      const along=axis==='h'?dx:dy;
      const index=sequence?(moving.num<other.num?0:1):(along>=0?1:0);
      const score=near*.40-(sameRank||sequence?actualTile*.22:0);
      if(score<bestDist){
        best={id:g.id,index,axis};
        bestDist=score;
      }
      continue;
    }
    const along=g.axis==='h'?x-box.x:y-box.y;
    const across=g.axis==='h'?y-box.y:x-box.x;
    // Connect a tile when it approaches the end of a group, even if invalid.
    const reach=actualTile*settings.magnet/100;
    const end=(g.tiles.length-1)*box.step/2;
    const maxAlong=end+box.step+reach;
    const maxAcross=actualTile*.70+reach*.35;
    if(Math.abs(along)>maxAlong||Math.abs(across)>maxAcross)continue;
    const overshoot=Math.max(0,Math.abs(along)-end-box.step);
    const normalGap=Math.max(0,Math.abs(across)-actualTile/2);
    const dist=normalGap*1.5+overshoot*1.2+
               Math.abs(across)*.18+Math.max(0,Math.abs(along)-end)*.08;
    if(dist<bestDist) {
      const index=clamp(Math.round(along/box.step+g.tiles.length/2),0,g.tiles.length);
      best={id:g.id,index};bestDist=dist;
    }
  }
  return best;
}
function pointerDown(e,t) {
  if(won||active||$('lab').classList.contains('show')||e.button>0)return;
  e.preventDefault();
  dismissOpeningHint();
  const old=snapshot(),rect=t.el.getBoundingClientRect();
  const colors=new Map(groups.map(g=>[g.id,isValid(g)]));
  let heldColor=false;
  {
    const idx=groups.findIndex(g=>g.tiles.includes(t));
    if(idx<0)return;
    const g=groups[idx],pos=g.tiles.indexOf(t),before=g.tiles.length;
    heldColor=colors.get(g.id);
    g.tiles.splice(pos,1);
    // Pulling a middle tile out of a long horizontal run can split the sequence.
    if(g.axis==='h'&&pos>=3&&before-pos-1>=3) {
      const right=g.tiles.splice(pos);
      const fullWidth=before*actualTile+(before-1)*settings.gap;
      const leftWidth=g.tiles.length*actualTile+Math.max(0,g.tiles.length-1)*settings.gap;
      const rightWidth=right.length*actualTile+Math.max(0,right.length-1)*settings.gap;
      const rightGroup=groupNew(right,'h',clamp(g.u+(fullWidth-rightWidth)/2/boardW,0,1),g.v);
      colors.set(rightGroup.id,colors.get(g.id));
      g.u=clamp(g.u-(fullWidth-leftWidth)/2/boardW,0,1);
      groups.splice(idx+1,0,rightGroup);
    }
    if(!g.tiles.length){g.el.remove();groups.splice(idx,1);}
  }
  active={
    tile:t,pointerId:e.pointerId,
    dx:rect.left+rect.width/2-e.clientX,
    dy:rect.top+rect.height/2-e.clientY,
    before:old, colors
  };
  // Each lifted tile carries a linked-group outline with it.  It is the
  // colour it had before pickup; a new verdict waits until drop.
  t.el.style.boxShadow=
    `0 0 0 ${settings.gap}px ${heldColor?'var(--green)':'var(--red)'}, `+
    '0 15px 26px #0009, 0 5px 9px #0006';
  clearLivePreview();
  hover=null;
  dragLayer.appendChild(t.el);
  t.el.classList.add('dragging');
  moveDrag(e);
  layout();
}
function moveDrag(e) {
  if(!active||e.pointerId!==active.pointerId)return;
  e.preventDefault();
  const a=active;
  let x=e.clientX+a.dx,y=e.clientY+a.dy;
  const b=board.getBoundingClientRect();
  x=clamp(x,b.left+actualTile/2,b.right-actualTile/2);
  y=clamp(y,b.top+actualTile/2,b.bottom-actualTile/2);
  posStyle(a.tile.el,x-actualTile/2,y-actualTile/2,1.035);
  const next=getHover(x,y);
  hover=next;
  // Coalesce pointermove events into one collision/layout update per frame.
  // The held tile itself tracks the finger directly above, without a spring.
  scheduleLivePreview(x,y);
}
function cancelDrag() {
  if(!active)return;
  clearLivePreview();
  const s=active.before;
  active.tile.el.classList.remove('dragging');
  active.tile.el.style.boxShadow='';
  active=null;hover=null;
  restore(s);
}
function pointerUp(e) {
  if(!active||e.pointerId!==active.pointerId)return;
  e.preventDefault();
  const a=active,t=a.tile,br=board.getBoundingClientRect();
  const x=e.clientX+a.dx,y=e.clientY+a.dy;
  if(x<br.left||x>br.right||y<br.top||y>br.bottom){cancelDrag();return;}
  const target=getHover(x,y);
  let g=target&&groups.find(g=>g.id===target.id);
  if(g) {
    g.tiles.splice(target.index,0,t);
    if(target.axis)g.axis=target.axis;
    if(g.tiles.length===2) {
      const [first,second]=g.tiles;
      if(first.num===second.num&&first.col!==second.col)g.axis='v';
      else if(first.col===second.col&&Math.abs(first.num-second.num)===1)g.axis='h';
    }
  } else {
    g=groupNew([t],'h',clamp((x-br.left)/boardW,0,1),clamp((y-br.top)/boardH,0,1));
    groups.push(g);
  }
  t.el.classList.remove('dragging');
  t.el.style.boxShadow='';
  clearLivePreview();
  active=null;hover=null;
  if(!reflowGroups(g.id)) {
    restore(a.before);
    return;
  }
  history.push(a.before);
  layout();
  checkWin();
}
function checkWin() {
  if(groups.length&&groups.every(isValid) && groups.reduce((n,g)=>n+g.tiles.length,0)===tiles.length) {
    won=true;stopNudge();
    const last=level===LEVELS.length-1;
    $('winHeading').textContent=last?'Chapter complete!':'Beautifully done.';
    $('winSub').textContent=last?'Five clever moves. Ready for more.':'Every tile has found its place.';
    $('nextWin').textContent=last?'REPLAY CHAPTER →':'NEXT LEVEL →';
    $('win').classList.add('show');
  }
}
window.addEventListener('pointermove',moveDrag,{passive:false});
window.addEventListener('pointerup',pointerUp,{passive:false});
window.addEventListener('pointercancel',e=>{if(active&&e.pointerId===active.pointerId)cancelDrag();});
window.addEventListener('blur',cancelDrag);
function undo() {if(active)cancelDrag(); if(!history.length)return;restore(history.pop());layout();}
$('undo').addEventListener('click',undo);
$('reset').addEventListener('click',()=>loadLevel(level));
$('prev').addEventListener('click',()=>loadLevel(level-1));
$('next').addEventListener('click',()=>loadLevel(level+1));
$('nextWin').addEventListener('click',()=>loadLevel(level+1));
function applySettings() {
  for(const key of ['tile','corner','gap','spring','magnet']){
    $(key+'Range').value=settings[key];
    $(key+'Out').textContent=settings[key]+(key==='spring'?'ms':key==='magnet'?'%':'px');
  }
  try{localStorage.setItem('remixaLab',JSON.stringify(settings));}catch(_){}
  if(!active)reflowGroups();
  else if(previewPoint)scheduleLivePreview(previewPoint.x,previewPoint.y);
  layout();
}
for(const key of ['tile','corner','gap','spring','magnet'])
  $(key+'Range').addEventListener('input',e=>{
    settings[key]=Number(e.target.value);
    $(key+'Out').textContent=settings[key]+(key==='spring'?'ms':key==='magnet'?'%':'px');
    applySettings();
  });
const lab=$('lab');
function hideLab(){lab.classList.remove('show');}
$('settings').addEventListener('click',()=>lab.classList.toggle('show'));
$('closeLab').addEventListener('click',hideLab);
$('closeLab2').addEventListener('click',hideLab);
$('resetLab').addEventListener('click',()=>{settings={...defaults};applySettings();});
window.addEventListener('resize',()=>{
  if(!active)reflowGroups();
  else if(previewPoint)scheduleLivePreview(previewPoint.x,previewPoint.y);
  layout(true);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')hideLab();
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
});
loadLevel(0);applySettings();
</script>
